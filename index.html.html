<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Philly Special Team Wheel</title>
<style>
:root{--bg:#0a0d12;--panel:#121722;--line:#283142;--text:#f7f8fb;--muted:#9ba7b8;--accent:#56e39f}
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:radial-gradient(circle at top,#182236,#080a0e 55%);color:var(--text);min-height:100vh;padding:24px}.app{max-width:1100px;margin:auto}.head{text-align:center;margin-bottom:20px}.head h1{margin:0;font-size:clamp(28px,5vw,52px);letter-spacing:2px}.head p{color:var(--muted);margin:7px 0}.grid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px}.card{background:rgba(18,23,34,.94);border:1px solid var(--line);border-radius:18px;padding:18px}.wheelwrap{position:relative;max-width:620px;margin:auto}.pointer{position:absolute;z-index:4;left:50%;top:-4px;transform:translateX(-50%);width:0;height:0;border-left:18px solid transparent;border-right:18px solid transparent;border-top:38px solid #fff;filter:drop-shadow(0 3px 3px #000)}canvas{width:100%;height:auto;display:block}.controls{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.btn{border:1px solid var(--line);background:#1b2330;color:white;border-radius:12px;padding:13px 18px;font-weight:800;cursor:pointer;min-height:46px}.btn.primary{background:var(--accent);color:#06130d;border-color:var(--accent);font-size:18px;flex:1}.btn:disabled{opacity:.45;cursor:not-allowed}.result{text-align:center;margin-top:14px;padding:14px;border:1px solid var(--line);border-radius:13px;background:#0d121b}.result small{color:var(--muted)}#winner{font-size:28px;font-weight:900;margin-top:3px}.status{display:flex;justify-content:space-between;color:var(--muted);font-size:14px;margin-bottom:12px}.history{max-height:540px;overflow:auto}.pick{padding:10px 4px;border-bottom:1px solid var(--line);display:flex;gap:10px}.pick b{color:var(--accent)}.empty{color:var(--muted)}.note{font-size:12px;color:var(--muted);margin-top:14px;line-height:1.45}@media(max-width:800px){body{padding:12px}.grid{grid-template-columns:1fr}.card{padding:13px}.history{max-height:none}}
</style>
</head>
<body><main class="app">
<div class="head"><h1>PHILLY SPECIAL</h1><p>Madden Team Draft Wheel</p></div>
<div class="grid">
<section class="card"><div class="status"><span id="remaining">32 teams remaining</span><span>Winner is removed automatically</span></div>
<div class="wheelwrap"><div class="pointer"></div><canvas id="wheel" width="700" height="700" aria-label="NFL team wheel"></canvas></div>
<div class="controls"><button class="btn primary" id="spin">SPIN THE WHEEL</button><button class="btn" id="undo">Undo</button><button class="btn" id="reset">Reset</button></div>
<div class="result" aria-live="polite"><small>SELECTED TEAM</small><div id="winner">Ready to spin</div></div></section>
<aside class="card"><h2 style="margin-top:0">Draft Results</h2><div id="history" class="history"><div class="empty">No teams selected yet.</div></div><div class="note">Each winning team is removed from future spins. Use Undo if a result needs to be returned to the wheel.</div></aside>
</div></main>
<script>
const original=['Arizona Cardinals','Atlanta Falcons','Baltimore Ravens','Buffalo Bills','Carolina Panthers','Chicago Bears','Cincinnati Bengals','Cleveland Browns','Dallas Cowboys','Denver Broncos','Detroit Lions','Green Bay Packers','Houston Texans','Indianapolis Colts','Jacksonville Jaguars','Kansas City Chiefs','Las Vegas Raiders','Los Angeles Chargers','Los Angeles Rams','Miami Dolphins','Minnesota Vikings','New England Patriots','New Orleans Saints','New York Giants','New York Jets','Philadelphia Eagles','Pittsburgh Steelers','San Francisco 49ers','Seattle Seahawks','Tampa Bay Buccaneers','Tennessee Titans','Washington Commanders'];
let teams=[...original],history=[],rotation=0,spinning=false;
const canvas=document.getElementById('wheel'),ctx=canvas.getContext('2d'),spin=document.getElementById('spin'),undo=document.getElementById('undo'),reset=document.getElementById('reset'),winner=document.getElementById('winner'),hist=document.getElementById('history'),remaining=document.getElementById('remaining');
const colors=['#274c77','#7b2cbf','#007f5f','#bc6c25','#9d0208','#3a5a40','#5f0f40','#264653'];
function draw(){const W=canvas.width,C=W/2,R=C-16;ctx.clearRect(0,0,W,W);if(!teams.length){ctx.fillStyle='#171d28';ctx.beginPath();ctx.arc(C,C,R,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';ctx.font='bold 34px Arial';ctx.textAlign='center';ctx.fillText('DRAFT COMPLETE',C,C);return}const step=Math.PI*2/teams.length;teams.forEach((t,i)=>{const a=rotation+i*step-Math.PI/2;ctx.beginPath();ctx.moveTo(C,C);ctx.arc(C,C,R,a,a+step);ctx.closePath();ctx.fillStyle=colors[i%colors.length];ctx.fill();ctx.strokeStyle='#0a0d12';ctx.lineWidth=2;ctx.stroke();ctx.save();ctx.translate(C,C);ctx.rotate(a+step/2);ctx.textAlign='right';ctx.fillStyle='#fff';ctx.font=`bold ${teams.length>24?13:teams.length>16?15:18}px Arial`;ctx.shadowColor='#000';ctx.shadowBlur=3;const label=t.replace('Washington ','W. ').replace('New England ','NE ').replace('Jacksonville ','JAX ').replace('Indianapolis ','IND ').replace('Philadelphia ','PHI ').replace('Cincinnati ','CIN ');ctx.fillText(label,R-22,5);ctx.restore()});ctx.beginPath();ctx.arc(C,C,64,0,Math.PI*2);ctx.fillStyle='#0b1018';ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=4;ctx.stroke();ctx.fillStyle='#fff';ctx.font='900 22px Arial';ctx.textAlign='center';ctx.fillText('M27',C,C+8)}
function ui(){remaining.textContent=`${teams.length} team${teams.length===1?'':'s'} remaining`;spin.disabled=spinning||!teams.length;undo.disabled=spinning||!history.length;reset.disabled=spinning;hist.innerHTML=history.length?history.map((x,i)=>`<div class="pick"><b>${i+1}.</b><span>${x}</span></div>`).join(''):'<div class="empty">No teams selected yet.</div>';draw()}
spin.onclick=()=>{if(spinning||!teams.length)return;spinning=true;ui();const chosen=Math.floor(Math.random()*teams.length),step=Math.PI*2/teams.length,target=-chosen*step-step/2,turns=6+Math.floor(Math.random()*3),start=rotation,end=target+turns*Math.PI*2,dur=4000,t0=performance.now();function frame(now){let p=Math.min(1,(now-t0)/dur),e=1-Math.pow(1-p,4);rotation=start+(end-start)*e;draw();if(p<1)requestAnimationFrame(frame);else{const selected=teams[chosen];history.push(selected);teams.splice(chosen,1);rotation=0;winner.textContent=selected;spinning=false;ui()}}requestAnimationFrame(frame)};
undo.onclick=()=>{if(spinning||!history.length)return;const x=history.pop();teams.push(x);teams.sort((a,b)=>original.indexOf(a)-original.indexOf(b));winner.textContent=x+' returned';ui()};
reset.onclick=()=>{if(spinning)return;teams=[...original];history=[];rotation=0;winner.textContent='Ready to spin';ui()};ui();
</script></body></html>
